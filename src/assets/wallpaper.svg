<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2=".15" y2="1">
          <stop offset="0" stop-color="#07080f"/>
          <stop offset=".34" stop-color="#161433"/>
          <stop offset=".60" stop-color="#3a2049"/>
          <stop offset=".80" stop-color="#7a3547"/>
          <stop offset=".93" stop-color="#b95f3f"/>
          <stop offset="1" stop-color="#d98048"/>
        </linearGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#7C5CFF" stop-opacity=".55"/>
          <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sun" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#ffb37a" stop-opacity=".85"/>
          <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a2a5e"/><stop offset="1" stop-color="#2a1a3c"/>
        </linearGradient>
        <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a1c3c"/><stop offset="1" stop-color="#150f20"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#131020"/><stop offset="1" stop-color="#08070d"/>
        </linearGradient>
        <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fe9ff" stop-opacity=".9"/>
          <stop offset=".55" stop-color="#5fc4e0" stop-opacity=".45"/>
          <stop offset="1" stop-color="#5fc4e0" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <rect width="1440" height="900" fill="url(#sky)"/>
      <ellipse cx="260" cy="150" rx="460" ry="330" fill="url(#glow)" opacity=".7"/>
      <ellipse cx="1332" cy="412" rx="300" ry="220" fill="url(#sun)"/>
      <circle cx="1332" cy="412" r="38" fill="#ffe3bd" opacity=".85"/>
      <g fill="#fff">
        <circle cx="180" cy="120" r="1.4" opacity=".8"/><circle cx="320" cy="70" r="1" opacity=".5"/>
        <circle cx="520" cy="150" r="1.2" opacity=".6"/><circle cx="690" cy="90" r="1" opacity=".45"/>
        <circle cx="880" cy="60" r="1.3" opacity=".7"/><circle cx="1180" cy="110" r="1" opacity=".4"/>
        <circle cx="1320" cy="200" r="1.2" opacity=".5"/><circle cx="430" cy="230" r="1" opacity=".35"/>
        <circle cx="140" cy="300" r="1.1" opacity=".4"/><circle cx="980" cy="180" r="1" opacity=".35"/>
      </g>

      <path d="M0 560 L120 500 L210 545 L330 470 L455 540 L560 495 L700 560 L820 505 L960 555 L1100 500 L1260 550 L1440 498 L1440 900 L0 900 Z" fill="url(#far)" opacity=".95"/>
      <path d="M0 640 L90 590 L170 630 L300 570 L410 625 L520 585 L660 645 L800 595 L930 640 L1080 590 L1230 635 L1440 585 L1440 900 L0 900 Z" fill="url(#mid)"/>

      <!-- 浮空岛 -->
      <g>
        <!-- 瀑布 -->
        <rect x="1042" y="366" width="17" height="46" fill="url(#fall)" opacity=".7"/>
        <!-- 树干 -->
        <rect x="966" y="250" width="15" height="70" fill="#4a3524"/>
        <rect x="966" y="250" width="5" height="70" fill="#604731"/>
        <!-- 树叶 -->
        <g fill="#4c9a60">
          <rect x="936" y="210" width="76" height="32"/>
          <rect x="908" y="230" width="40" height="28"/>
          <rect x="1000" y="228" width="42" height="30"/>
          <rect x="954" y="184" width="42" height="30"/>
        </g>
        <g fill="#3a7c4b">
          <rect x="936" y="242" width="76" height="10"/>
          <rect x="908" y="258" width="40" height="8"/>
          <rect x="1000" y="258" width="42" height="8"/>
        </g>
        <g fill="#5fb073" opacity=".65">
          <rect x="954" y="184" width="42" height="6"/>
          <rect x="936" y="210" width="76" height="5"/>
        </g>
        <!-- 草顶 -->
        <path d="M884 334 L1120 334 L1140 350 L1120 366 L884 366 L864 350 Z" fill="#4f9a63"/>
        <path d="M884 334 L1120 334 L1140 350 L884 350 L864 350 Z" fill="#68b87c"/>
        <!-- 泥土 -->
        <path d="M884 366 L1120 366 L1082 442 L1002 480 L922 442 Z" fill="#4a3826"/>
        <path d="M884 366 L1120 366 L1106 392 L898 392 Z" fill="#3b2d1f"/>
        <path d="M922 442 L1002 480 L1082 442 L1058 458 L1002 492 L946 458 Z" fill="#31251a"/>
        <!-- 藤蔓 -->
        <rect x="896" y="366" width="4" height="40" fill="#3a7c4b" opacity=".85"/>
        <rect x="1014" y="366" width="4" height="58" fill="#3a7c4b" opacity=".8"/>
        <rect x="1096" y="366" width="4" height="26" fill="#3a7c4b" opacity=".7"/>
        <!-- 浮空小方块 -->
        <g>
          <path d="M830 240 l12 -7 12 7 -12 7 z" fill="#8fbf7a"/>
          <path d="M830 240 v13 l12 7 v-13 z" fill="#5c8f4c"/>
          <path d="M854 240 v13 l-12 7 v-13 z" fill="#426b36"/>
        </g>
        <g opacity=".8">
          <path d="M1268 330 l9 -5 9 5 -9 5 z" fill="#c9a6ff"/>
          <path d="M1268 330 v9 l9 5 v-9 z" fill="#8f6bd6"/>
          <path d="M1286 330 v9 l-9 5 v-9 z" fill="#6a4ca8"/>
        </g>
      </g>
      <!-- 水面 -->
      <rect y="800" width="1440" height="100" fill="url(#water)"/>
      <g stroke="#5b4a7a" stroke-width="1" opacity=".22">
        <line x1="80" y1="820" x2="360" y2="820"/><line x1="180" y1="838" x2="520" y2="838"/>
        <line x1="60" y1="858" x2="300" y2="858"/><line x1="420" y1="872" x2="760" y2="872"/>
        <line x1="900" y1="826" x2="1240" y2="826"/><line x1="1040" y1="850" x2="1380" y2="850"/>
        <line x1="820" y1="874" x2="1120" y2="874"/>
      </g>
      <!-- 反射 -->
      <g opacity=".18" filter="blur(1px)">
        <path d="M960 800 h96 v60 h-96 z" fill="#6d9448"/>
        <path d="M110 800 h150 v50 h-150 z" fill="#2b4034"/>
      </g>
    </svg>